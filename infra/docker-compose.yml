services:
  mongodb:
    image: mongo:7
    container_name: ghost-racer-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
  redis:
    image: redis:7-alpine
    container_name: ghost-racer-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

volumes:
  mongodb-data:
  redis-data:
